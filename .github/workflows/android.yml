name: Build Android APK

# Builds a real, installable APK in the cloud — no Android Studio needed.
#
#   • every push / PR  → APK available as a downloadable artifact
#   • pushing a tag v*  → also published as a GitHub Release asset
#
# The game is fully offline, so the APK needs no network permission at runtime.

on:
  push:
    branches:
      - main
      - 'arena/**'
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    name: Assemble debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Build web bundle (offline check enforced)
        run: npm run build:www

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Locate APK
        id: find_apk
        run: |
          APK=$(find android/app/build/outputs/apk/debug -name '*.apk' | head -n 1)
          if [ -z "$APK" ]; then
            echo "No APK produced"; exit 1
          fi
          echo "apk=$APK" >> "$GITHUB_OUTPUT"
          ls -lh "$APK"
          unzip -l "$APK" | head -n 20

      - name: Rename APK
        run: |
          mkdir -p dist
          cp "${{ steps.find_apk.outputs.apk }}" \
             "dist/TheLastHand-${{ github.sha }}.apk"
          ls -lh dist/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: the-last-hand-apk
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 90

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
